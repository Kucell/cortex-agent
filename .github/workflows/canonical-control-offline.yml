name: Canonical Control Offline Contracts

on:
  pull_request:
    paths:
      - "lib/**"
      - "packages/**"
      - "bin/cli.js"
      - "tests/feedback/**"
      - "tests/dispatch/phase-zero-source-manifest.json"
      - "package.json"
      - "scripts/codex-p002-shadow-pilot.js"
      - "templates/_shared/.agent/contracts/state-classes.json"
      - "templates/_shared/.agent/skills/management-api/scripts/query-dispatch-state.js"
      - "lib/governance/canonical-control.js"
      - "lib/governance/canonical-records.js"
      - "lib/governance/canonical-control.schema.json"
      - "lib/governance/github-control-store.js"
      - "lib/governance/git-transaction-store.js"
      - "lib/governance/github-selection.js"
      - "lib/governance/github-selection-evidence.schema.json"
      - "templates/_shared/.agent/decisions/decision.schema.json"
      - "templates/_shared/.agent/decisions/index.schema.json"
      - "templates/_shared/.agent/waitpoints/waitpoint.schema.json"
      - "templates/_shared/.agent/waitpoints/index.schema.json"
      - "templates/_shared/.agent/tasks/task.schema.json"
      - "tests/governance/canonical-control.test.js"
      - "tests/governance/github-control-store.test.js"
      - "lib/runtime-state/runtime-admission.js"
      - "lib/runtime-port/strict-entry.js"
      - "tests/runtime-state/runtime-admission.test.js"
      - "tests/runtime-port/strict-entry.test.js"
      - "lib/runtime-state/operation-lifecycle.js"
      - "lib/security/scan.js"
      - "packages/runtime-port/src/index.js"
      - "packages/runtime-port/src/topology.js"
      - "packages/protocol/src/index.js"
      - "packages/protocol/src/refs.js"
      - "packages/protocol/src/version.js"
      - "packages/protocol/src/result.js"
      - "packages/protocol/src/capabilities.js"
      - "packages/protocol/src/events.js"
      - "packages/protocol/src/timeline.js"
      - "packages/protocol/src/negotiation.js"
      - "packages/protocol/src/evolution.js"
      - ".github/workflows/canonical-control-offline.yml"
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    env:
      SOURCE_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Read exact bounded source closure
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        with:
          script: |
            const fs=require('node:fs'),path=require('node:path'),crypto=require('node:crypto'),assert=require('node:assert/strict');
            assert.match(process.env.SOURCE_HEAD||'',/^[a-f0-9]{40}$/);
            const root=fs.mkdtempSync(path.join(fs.realpathSync(process.env.RUNNER_TEMP),'cortex-control-offline-'));
            fs.mkdirSync(path.join(root,'source'));fs.mkdirSync(path.join(root,'home'));fs.mkdirSync(path.join(root,'tmp'));const proof={sources:[]};
            async function materialize(owner,repo,head,files,prefix=''){
             assert.match(head,/^[a-f0-9]{40}$/);const {data:commit}=await github.rest.git.getCommit({owner,repo,commit_sha:head});assert.equal(commit.sha,head);
             const {data:tree}=await github.rest.git.getTree({owner,repo,tree_sha:commit.tree.sha,recursive:'true'});assert.equal(tree.truncated,false);assert.equal(tree.sha,commit.tree.sha);
             for(const relative of files){
              const entry=tree.tree.find(x=>x.path===relative);assert.ok(entry,'Missing '+relative);assert.equal(entry.type,'blob');assert.equal(entry.mode,'100644');
              const {data:file}=await github.rest.repos.getContent({owner,repo,path:relative,ref:head});assert.equal(file.path,relative);assert.equal(file.type,'file');assert.equal(file.encoding,'base64');assert.equal(file.sha,entry.sha);
              const bytes=Buffer.from(file.content,'base64');assert.equal(bytes.length,file.size);assert.ok(bytes.length<=2097152);
              const blob=crypto.createHash('sha1').update('blob '+bytes.length+'\0').update(bytes).digest('hex');assert.equal(blob,entry.sha);
              const destination=prefix+relative;assert.ok(!path.isAbsolute(destination)&&!destination.split('/').includes('..'));
              const filePath=path.join(root,'source',destination);assert.ok(filePath.startsWith(path.join(root,'source')+path.sep));fs.mkdirSync(path.dirname(filePath),{recursive:true});fs.writeFileSync(filePath,bytes,{flag:'wx',mode:0o444});
              const item={repository:owner+'/'+repo,source_head:head,tree:tree.sha,path:relative,destination,blob};proof.sources.push(item);core.info(JSON.stringify(item));
             }
            }
            await materialize(context.repo.owner,context.repo.repo,process.env.SOURCE_HEAD,["lib/governance/canonical-control.js","lib/governance/canonical-records.js","lib/governance/canonical-control.schema.json","lib/governance/github-control-store.js","lib/governance/git-transaction-store.js","lib/governance/github-selection.js","lib/governance/github-selection-evidence.schema.json","templates/_shared/.agent/decisions/decision.schema.json","templates/_shared/.agent/decisions/index.schema.json","templates/_shared/.agent/waitpoints/waitpoint.schema.json","templates/_shared/.agent/waitpoints/index.schema.json","templates/_shared/.agent/tasks/task.schema.json","tests/governance/canonical-control.test.js","tests/governance/github-control-store.test.js","lib/runtime-state/runtime-admission.js","lib/runtime-port/strict-entry.js","tests/runtime-state/runtime-admission.test.js","tests/runtime-port/strict-entry.test.js","lib/runtime-state/operation-lifecycle.js","lib/security/scan.js","packages/runtime-port/src/index.js","packages/runtime-port/src/topology.js","packages/protocol/src/index.js","packages/protocol/src/refs.js","packages/protocol/src/version.js","packages/protocol/src/result.js","packages/protocol/src/capabilities.js","packages/protocol/src/events.js","packages/protocol/src/timeline.js","packages/protocol/src/negotiation.js","packages/protocol/src/evolution.js"]);
            fs.writeFileSync(path.join(root,'source-proof.json'),JSON.stringify(proof)+'\n',{flag:'wx',mode:0o444});core.exportVariable('CORTEX_OFFLINE_ROOT',root);core.info(JSON.stringify({source_count:proof.sources.length,read_only_materialization:true}));
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node }}
      - name: Run 50 bounded synthetic tests in three isolated suites
        shell: bash
        run: |
          set -euo pipefail
          scratch="$CORTEX_OFFLINE_ROOT"
          node_bin="$(command -v node)"
          "$node_bin" --version
          /usr/bin/git --version
          cat > "$scratch/offline-guard.cjs" <<'GUARD'
          'use strict';
          // Synthetic fixture tripwire; not an adversarial Host sandbox.
          const fs=require('node:fs'),path=require('node:path'),assert=require('node:assert/strict');
          const root=fs.realpathSync(process.env.CORTEX_TEST_TMP);let network=0,children=0;
          const deny=kind=>function(){network++;throw Object.assign(new Error('OFFLINE_NETWORK_DISABLED:'+kind),{code:'OFFLINE_NETWORK_DISABLED'});};
          for(const [name,methods]of [['node:http',['request','get','createServer']],['node:https',['request','get','createServer']],['node:http2',['connect','createServer','createSecureServer']],['node:net',['connect','createConnection','createServer']],['node:tls',['connect','createServer']],['node:dgram',['createSocket']]]){const api=require(name);for(const method of methods)api[method]=deny(name+'.'+method);}
          require('node:net').Socket.prototype.connect=deny('Socket.connect');require('node:net').Server.prototype.listen=deny('Server.listen');
          for(const api of [require('node:dns'),require('node:dns/promises')])for(const name of Object.keys(api))if(typeof api[name]==='function'&&/^(lookup|resolve|reverse|setServers)/.test(name))api[name]=deny('dns.'+name);
          globalThis.fetch=deny('fetch');globalThis.WebSocket=deny('WebSocket');
          const cp=require('node:child_process'),realSpawn=cp.spawnSync.bind(cp),git=fs.realpathSync('/usr/bin/git');
          for(const name of ['exec','execSync','execFile','execFileSync','spawn','fork'])cp[name]=()=>{throw new Error('OFFLINE_CHILD_METHOD_DISABLED:'+name);};
          const verbs=new Set(['init','rev-parse','for-each-ref','ls-remote','fetch','push','unpack-objects','cat-file','ls-tree','hash-object','mktree','commit-tree','update-ref','merge-base']);
          cp.spawnSync=(executable,args,options)=>{
           assert.equal(executable,git);assert.ok(Array.isArray(args)&&args.every(x=>typeof x==='string'));assert.ok(options&&options.shell===false);
           const cwd=fs.realpathSync(options.cwd);assert.ok(cwd.startsWith(root+path.sep));assert.equal(options.env.GIT_ALLOW_PROTOCOL,'file');
           assert.equal(options.env.GIT_CONFIG_NOSYSTEM,'1');assert.equal(options.env.GIT_CONFIG_GLOBAL,'/dev/null');
           for(const key of ['GITHUB_TOKEN','GH_TOKEN','CORTEX_GIT_AUTH','NODE_OPTIONS','NODE_PATH'])assert.equal(options.env[key],undefined);
           assert.ok(args.includes('core.hooksPath=/dev/null'));assert.ok(args.some(x=>verbs.has(x)));assert.ok(args.every(x=>! /^(?:https?|ssh|git):/.test(x)));
           for(const arg of args.filter(x=>x.startsWith('file://')))assert.ok(arg.slice(7).startsWith(root+path.sep));
           assert.ok(Number.isInteger(options.timeout)&&options.timeout>0&&options.timeout<=15000);assert.ok(options.maxBuffer>0&&options.maxBuffer<=1048576);assert.ok(++children<=4000,'offline Git child budget exceeded');
           return realSpawn(executable,args,options);
          };
          process.once('exit',()=>{console.log('# CORTEX_OFFLINE network_attempts='+network+' git_children='+children);if(network!==0)process.exitCode=1;});
          GUARD
          cd "$scratch/source"
          major="$("$node_bin" -p 'process.versions.node.split(".")[0]')"
          case "$major" in
            22) isolation="--experimental-test-isolation=none" ;;
            24) isolation="--test-isolation=none" ;;
            *) exit 1 ;;
          esac
          # Fixed independent suites prevent fixture mocks from crossing process boundaries.
          # Each retains the 4000 Git-child ceiling; this job is bounded to 12000 total.
          for suite in control admission entry; do
            case "$suite" in
              control) expected=35; test_files=(tests/governance/canonical-control.test.js tests/governance/github-control-store.test.js) ;;
              admission) expected=7; test_files=(tests/runtime-state/runtime-admission.test.js) ;;
              entry) expected=8; test_files=(tests/runtime-port/strict-entry.test.js) ;;
              *) exit 1 ;;
            esac
            echo "CORTEX_OFFLINE_SUITE=$suite EXPECTED=$expected"
            env -i PATH=/usr/bin:/bin HOME="$scratch/home" USERPROFILE="$scratch/home" \
             TMPDIR="$scratch/tmp" TMP="$scratch/tmp" TEMP="$scratch/tmp" XDG_CONFIG_HOME="$scratch/home" \
             LANG=C LC_ALL=C TZ=UTC CORTEX_TEST_TMP="$scratch/tmp" \
             /usr/bin/timeout --signal=TERM --kill-after=5 180 "$node_bin" \
             --require="$scratch/offline-guard.cjs" --test "$isolation" --test-concurrency=1 --test-reporter=tap "${test_files[@]}" | tee "$scratch/tap-$suite.log"
          done
          env -i PATH="" "$node_bin" - "$scratch" 31 <<'VERIFY'
          const fs=require('node:fs'),path=require('node:path'),crypto=require('node:crypto'),assert=require('node:assert/strict');
          const [root,count]=process.argv.slice(2),suites=[['control',35],['admission',7],['entry',8]];let gitChildren=0;
          for(const [suite,expected]of suites){
            const tap=fs.readFileSync(path.join(root,'tap-'+suite+'.log'),'utf8');
            for(const [key,value]of Object.entries({tests:expected,pass:expected,fail:0,cancelled:0,skipped:0,todo:0}))assert.deepEqual([...tap.matchAll(new RegExp('^# '+key+' (\\d+)\\s*$','gm'))].map(m=>Number(m[1])),[value],'Unexpected '+suite+' '+key);
            const guards=[...tap.matchAll(/^# CORTEX_OFFLINE network_attempts=(\d+) git_children=(\d+)$/gm)];assert.equal(guards.length,1);assert.equal(Number(guards[0][1]),0);assert.ok(Number(guards[0][2])<=4000);gitChildren+=Number(guards[0][2]);
          }
          assert.ok(gitChildren<=12000);
          const proof=JSON.parse(fs.readFileSync(path.join(root,'source-proof.json'),'utf8'));assert.equal(proof.sources.length,Number(count));
          for(const item of proof.sources){const file=path.join(root,'source',item.destination),st=fs.lstatSync(file);assert.ok(st.isFile()&&!st.isSymbolicLink());assert.equal(st.mode&0o777,0o444);const bytes=fs.readFileSync(file),blob=crypto.createHash('sha1').update('blob '+bytes.length+'\0').update(bytes).digest('hex');assert.equal(blob,item.blob,'Source changed: '+item.destination);}
          const actual=[];function walk(dir,prefix=''){for(const entry of fs.readdirSync(dir,{withFileTypes:true})){const relative=prefix+entry.name;assert.equal(entry.isSymbolicLink(),false);if(entry.isDirectory())walk(path.join(dir,entry.name),relative+'/');else{assert.ok(entry.isFile());actual.push(relative);}}}
          walk(path.join(root,'source'));assert.deepEqual(actual.sort(),proof.sources.map(x=>x.destination).sort());assert.deepEqual(fs.readdirSync(path.join(root,'tmp')),[],'Owned fixtures not cleaned');
          console.log(JSON.stringify({tests:50,suites:Object.fromEntries(suites),git_children:gitChildren,max_git_children:12000,source_count:proof.sources.length,source_unchanged:true,fixture_cleanup:true,evidence_level:'SYNTHETIC_OFFLINE_ONLY'}));
          VERIFY
          # Remove only after observed success, exact TAP, posthash and cleanup checks.
          # Failures retain disposable evidence until hosted-runner destruction.
          cd "$RUNNER_TEMP"
          rm -rf -- "$scratch"
          test ! -e "$scratch"
          echo "CORTEX_OFFLINE_ROOT_REMOVED=true"

  feedback:
    # Ordinary trusted-test runner. Deliberately no Node permission mode:
    # real fsync must run; this is NOT kernel-enforced file confinement.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    env:
      SOURCE_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Materialize exact-head reviewed feedback closure without checkout
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        with:
          script: |
            const fs=require('node:fs'),path=require('node:path'),crypto=require('node:crypto'),assert=require('node:assert/strict');
            const {owner,repo}=context.repo,head=process.env.SOURCE_HEAD,reviewed='c5eae77e2be3450286061e3ccc123880eb65c2d9';assert.match(head||'',/^[a-f0-9]{40}$/);
            async function treeFor(sha){const {data:c}=await github.rest.git.getCommit({owner,repo,commit_sha:sha});assert.equal(c.sha,sha);const {data:t}=await github.rest.git.getTree({owner,repo,tree_sha:c.tree.sha,recursive:'true'});assert.equal(t.truncated,false);assert.equal(t.sha,c.tree.sha);return t;}
            const tree=await treeFor(head),baseline=await treeFor(reviewed);assert.equal(baseline.sha,'243c1d19745726684d38ac96ca907e5f812e40b6');
            const proof={source_head:head,tree:tree.sha,reviewed_head:reviewed,expected_github_api_calls:271,sources:[]},root=fs.mkdtempSync(path.join(fs.realpathSync(process.env.RUNNER_TEMP),'cortex-feedback-'));
            core.exportVariable('CORTEX_FEEDBACK_ROOT',root);core.info('Expected GitHub API requests: 271; any API failure fails closed; no alternate credentials or downloader');fs.chmodSync(root,0o700);for(const dir of ['source','fixtures'])fs.mkdirSync(path.join(root,dir),{mode:0o700});
            async function bytesFor(relative){
              assert.ok(typeof relative==='string'&&!path.isAbsolute(relative)&&!relative.split('/').some(x=>['','..','.git','node_modules'].includes(x)));assert.ok(!relative.split('/').includes('.agent')||relative.startsWith('templates/_shared/.agent/'));
              const entry=tree.tree.find(x=>x.path===relative),approved=baseline.tree.find(x=>x.path===relative);assert.ok(entry&&approved,'Missing '+relative);assert.equal(entry.type,'blob');assert.ok(['100644','100755'].includes(entry.mode));assert.equal(entry.mode,approved.mode);assert.equal(entry.sha,approved.sha,'Re-review changed feedback closure: '+relative);
              const {data:file}=await github.rest.repos.getContent({owner,repo,path:relative,ref:head});assert.equal(file.path,relative);assert.equal(file.type,'file');assert.equal(file.encoding,'base64');assert.equal(file.sha,entry.sha);
              const bytes=Buffer.from(file.content,'base64');assert.equal(bytes.length,file.size);assert.ok(bytes.length<=2097152);const blob=crypto.createHash('sha1').update('blob '+bytes.length+'\0').update(bytes).digest('hex');assert.equal(blob,entry.sha);return {bytes,blob};
            }
            const manifestPath='tests/dispatch/phase-zero-source-manifest.json',manifest=JSON.parse((await bytesFor(manifestPath)).bytes);
            assert.equal(manifest.sources.length,259);assert.equal(new Set(manifest.sources).size,259);assert.equal(manifest.sources.filter(x=>x.endsWith('.js')).length,254);
            const tests=['inbox','cli','multiprocess','redact','nudge'].map(x=>'tests/feedback/'+x+'.test.js'),files=[...new Set([...manifest.sources,'lib/feedback/nudge.js',...tests,manifestPath])];assert.equal(files.length,266);
            for(const relative of files){const {bytes,blob}=await bytesFor(relative),file=path.join(root,'source',relative);assert.ok(file.startsWith(path.join(root,'source')+path.sep));fs.mkdirSync(path.dirname(file),{recursive:true});fs.writeFileSync(file,bytes,{flag:'wx',mode:0o444});proof.sources.push({path:relative,blob,sha256:crypto.createHash('sha256').update(bytes).digest('hex')});}
            fs.writeFileSync(path.join(root,'source-proof.json'),JSON.stringify(proof)+'\n',{flag:'wx',mode:0o444});core.info(JSON.stringify(proof));
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node }}
      - name: Run exactly 45 feedback tests with real file writes and fsync
        shell: bash
        run: |
          set -euo pipefail
          scratch="$CORTEX_FEEDBACK_ROOT"
          node_bin="$(command -v node)"
          cat > "$scratch/feedback-guard.cjs" <<'GUARD'
          'use strict';
          // Trusted synthetic fixtures only; no kernel filesystem confinement or Host authority.
          const fs=require('node:fs'),path=require('node:path'),cp=require('node:child_process'),assert=require('node:assert/strict'),crypto=require('node:crypto');
          const source=process.env.PROBE_SOURCE,root=process.env.PROBE_FIXTURES,role=process.env.PROBE_ROLE;
          assert.ok([source,root].every(x=>x&&path.isAbsolute(x)));assert.ok(['suite','child'].includes(role));assert.equal(fs.realpathSync(source),source);assert.equal(fs.realpathSync(root),root);assert.equal(process.env.TMPDIR,path.join(root,'tmp'));assert.ok(fs.realpathSync(process.cwd()).startsWith(root+path.sep));
          const receipt={pid:process.pid,role,node:process.version,children:0,syncChildren:0,asyncChildren:0,blocked:[],spawnErrors:[]};
          const deny=kind=>(...args)=>{receipt.blocked.push(kind);throw new Error('FEEDBACK_BLOCKED:'+kind);};
          const Module=require('node:module'),resolve=Module._resolveFilename,load=Module._load;
          const allowed=new Set(JSON.parse(fs.readFileSync(path.join(path.dirname(source),'source-proof.json'),'utf8')).sources.map(x=>path.join(source,x.path)));
          allowed.add(__filename);allowed.add(path.join(root,'cwd','feedback.test.cjs'));
          function checkedResolve(request,parent,isMain,options){
           if(Module.isBuiltin(request))return resolve.call(Module,request,parent,isMain,options);
           if(request==='@cortex-agent/protocol'&&['packages/project-sdk/src/descriptor.js','packages/sdk/src/index.js'].some(x=>parent?.filename===path.join(source,x)))throw Object.assign(new Error("Cannot find module '@cortex-agent/protocol' (reviewed optional absence)"),{code:'MODULE_NOT_FOUND'});
           let file;try{file=resolve.call(Module,request,parent,isMain,options);}catch(error){return deny('unresolved-module:'+request)();}
           if(!allowed.has(file))return deny('outside-module:'+request)();return file;
          }
          Module._resolveFilename=checkedResolve;Module._load=function(request,parent,isMain){checkedResolve(request,parent,isMain);return load.apply(this,arguments);};
          process.once('exit',()=>{receipt.outside=Object.keys(require.cache).filter(x=>!allowed.has(x));receipt.loaded=Object.keys(require.cache).filter(x=>x.startsWith(source+path.sep)).map(x=>({path:path.relative(source,x),sha256:crypto.createHash('sha256').update(fs.readFileSync(x)).digest('hex')}));fs.writeFileSync(path.join(root,'audit',process.pid+'.json'),JSON.stringify(receipt)+'\n');});
          for(const [mod,names] of Object.entries({net:['connect','createConnection','createServer'],tls:['connect','createServer'],http:['request','get','createServer'],https:['request','get','createServer'],http2:['connect','createServer','createSecureServer'],dgram:['createSocket']}))for(const key of names)require('node:'+mod)[key]=deny(mod+'.'+key);
          require('node:net').Socket.prototype.connect=deny('Socket.connect');require('node:net').Server.prototype.listen=deny('Server.listen');
          for(const mod of [require('node:dns'),require('node:dns/promises')])for(const k of Object.keys(mod))if(typeof mod[k]==='function'&&/^(lookup|resolve|reverse|setServers)/.test(k))mod[k]=deny('dns.'+k);
          globalThis.fetch=deny('fetch');globalThis.WebSocket=deny('WebSocket');require('node:worker_threads').Worker=deny('Worker');
          const rawSync=cp.spawnSync,rawSpawn=cp.spawn;
          const base=['feedback','log','--title','test event','--kind','blocker','--severity','high','--project-slug','cortex-agent'];
          let syncCount=0,asyncCount=0;const indices=new Set();
          function environment(cwd){return {HOME:path.join(root,'home'),USERPROFILE:path.join(root,'home'),XDG_CONFIG_HOME:path.join(root,'home'),TMPDIR:path.join(root,'tmp'),TMP:path.join(root,'tmp'),TEMP:path.join(root,'tmp'),PATH:'',LANG:'C',LC_ALL:'C',TZ:'UTC',CORTEX_STATE_SYNC:'off',CORTEX_AGENT_FEEDBACK_PROJECT_ROOT:cwd,PROBE_SOURCE:source,PROBE_FIXTURES:root,PROBE_ROLE:'child'};}
          function argv(args){return ['--require',__filename,...args];}
          cp.spawnSync=(file,args,options={})=>{
           assert.equal(role,'suite');assert.equal(file,process.execPath);assert.ok(!options.shell);assert.equal(args[0],path.join(source,'bin/cli.js'));
           assert.ok([JSON.stringify(base),JSON.stringify([...base,'--token','leak'])].includes(JSON.stringify(args.slice(1))));
           const cwd=options.cwd;assert.ok(cwd.startsWith(path.join(root,'tmp')+path.sep));assert.equal(fs.realpathSync(cwd),cwd);assert.ok(++syncCount<=3);receipt.children++;receipt.syncChildren++;
           const result=rawSync(process.execPath,argv(args),{encoding:'utf8',cwd,env:environment(cwd),shell:false,timeout:15000,killSignal:'SIGKILL',maxBuffer:1048576});
           if(result.error||result.signal)receipt.spawnErrors.push({code:result.error?.code,signal:result.signal});return result;
          };
          function expectedWorker(inboxRoot,index){return [
           "const crypto = require('node:crypto');",
           'const { appendEvent } = require(' + JSON.stringify(path.join(source,'lib/feedback/inbox.js')) + ');',
           'const inboxRoot = ' + JSON.stringify(inboxRoot) + ';',
           "const prefix = 'mp-worker-" + index + "-';",
           'for (let i = 0; i < 4; i++) {',
           '  const r = appendEvent({','    inboxRoot,','    event: {','      schema_version: 1,',
           "      event_id: 'fev_' + crypto.randomUUID(),",'      occurred_at: new Date().toISOString(),',
           "      kind: 'observation',","      severity: 'low',",'      title: prefix + i,',
           "      source: { adapter: 'manual', project_slug: 'm024-ms003-mp' },","      fingerprint: 'pending',",
           '    },','  });','  if (!r.ok) { console.error(JSON.stringify(r)); process.exit(1); }','}',"console.log('worker-done');"
           ].join('\n');}
          cp.spawn=(file,args,options={})=>{
           assert.equal(role,'suite');assert.equal(file,process.execPath);assert.ok(!options.shell);assert.equal(args.length,2);assert.equal(args[0],'-e');
           const rootMatch=args[1].match(/^const inboxRoot = (.+);$/m),indexMatch=args[1].match(/^const prefix = 'mp-worker-([0-5])-';$/m);assert.ok(rootMatch&&indexMatch);
