name: Migration Preservation Contract

on:
  pull_request:
    paths:
      - "lib/commands/update/runtime-layout-migration.js"
      - "lib/runtime-layout/**"
      - "tests/update/runtime-layout-migration*.test.js"
      - ".github/workflows/migration-preservation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preservation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    env:
      SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Materialize verified exact-head migration sources
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("node:fs");
            const path = require("node:path");
            const crypto = require("node:crypto");
            const assert = require("node:assert/strict");
            const head = process.env.SOURCE_HEAD;
            assert.match(head || "", /^[0-9a-f]{40}$/);
            const { owner, repo } = context.repo;
            const { data: commit } = await github.rest.git.getCommit({
              owner, repo, commit_sha: head,
            });
            assert.equal(commit.sha, head, "source commit mismatch");
            const root = process.env.GITHUB_WORKSPACE;
            assert.ok(root, "GITHUB_WORKSPACE is required");
            for (const relative of [
              "lib/commands/update/runtime-layout-migration.js",
              "lib/runtime-layout/index.js",
              "lib/runtime-layout/resolver.js",
              "lib/runtime-layout/identity.js",
              "lib/runtime-layout/logical-uri.js",
              "lib/runtime-layout/local-binding.js",
              "lib/runtime-layout/schemas.js",
              "tests/update/runtime-layout-migration.test.js",
              "tests/update/runtime-layout-migration-preservation.test.js",
            ]) {
              const { data: file } = await github.rest.repos.getContent({
                owner, repo, path: relative, ref: head,
              });
              assert.ok(file && !Array.isArray(file), "expected one file");
              assert.equal(file.type, "file");
              assert.equal(file.path, relative);
              assert.equal(file.encoding, "base64");
              assert.equal(typeof file.content, "string");
              const bytes = Buffer.from(file.content, "base64");
              assert.equal(bytes.length, file.size, "source size mismatch");
              const blob = crypto.createHash("sha1")
                .update("blob " + bytes.length + "\0").update(bytes).digest("hex");
              assert.equal(blob, file.sha, "source blob mismatch");
              const destination = path.join(root, relative);
              fs.mkdirSync(path.dirname(destination), { recursive: true });
              fs.writeFileSync(destination, bytes, { flag: "wx" });
              core.info("Source " + head + ": " + relative + " (blob " + blob + ")");
            }
            core.info("Verified source head: " + head);
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Check migration syntax
        run: |
          node --check lib/commands/update/runtime-layout-migration.js
          node --check tests/update/runtime-layout-migration-preservation.test.js
          node --check tests/update/runtime-layout-migration.test.js
      - name: Run six preservation oracles
        run: node --test tests/update/runtime-layout-migration-preservation.test.js
      - name: Run existing migration regression
        run: node --test tests/update/runtime-layout-migration.test.js
