name: Phase Zero Public Bin Boundary

on:
  pull_request:
    paths:
      - "bin/cli.js"
      - "lib/**"
      - "packages/**"
      - "package.json"
      - "templates/_shared/.agent/skills/management-api/scripts/query-dispatch-state.js"
      - "scripts/codex-p002-shadow-pilot.js"
      - "tests/dispatch/phase-zero-bin-boundary.test.js"
      - "tests/dispatch/phase-zero-source-manifest.json"
      - ".github/workflows/phase-zero-bin-boundary.yml"

permissions:
  contents: read

jobs:
  phase-zero:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    env:
      SOURCE_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SOURCE_HEAD }}
          fetch-depth: 1
          submodules: false
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node }}
      - name: Verify exact head and isolate regular-file source closure
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_HEAD" =~ ^[a-f0-9]{40}$ ]]
          test "$(/usr/bin/git -c core.fsmonitor=false rev-parse HEAD)" = "$SOURCE_HEAD"
          test -z "$(/usr/bin/git -c core.fsmonitor=false status --porcelain --untracked-files=all)"
          scratch=$(mktemp -d "$RUNNER_TEMP/cortex-phase0.XXXXXX")
          trap 'rm -rf -- "$scratch"' EXIT
          mkdir -p "$scratch/source" "$scratch/home" "$scratch/tmp"
          /usr/bin/git -c core.fsmonitor=false ls-tree -rz --full-tree HEAD > "$scratch/tree"
          node_bin="$(command -v node)"
          env -i PATH="" HOME="$scratch/home" LANG=C LC_ALL=C TZ=UTC \
            "$node_bin" - "$GITHUB_WORKSPACE" "$scratch/source" "$scratch/tree" "$SOURCE_HEAD" <<'NODE'
          const fs = require("node:fs"), path = require("node:path"), crypto = require("node:crypto");
          const assert = require("node:assert/strict");
          const [checkout, root, treeFile, head] = process.argv.slice(2);
          const manifestPath = "tests/dispatch/phase-zero-source-manifest.json";
          const testPath = "tests/dispatch/phase-zero-bin-boundary.test.js";
          const tree = new Map(fs.readFileSync(treeFile, "utf8").split("\0").filter(Boolean).map((record) => {
            const tab = record.indexOf("\t");
            const [mode, type, blob] = record.slice(0, tab).split(" ");
            return [record.slice(tab + 1), { mode, type, blob }];
          }));
          assert.equal(tree.get(".agent").mode, "160000");
          const binding = path.join(checkout, ".agent");
          if (fs.existsSync(binding)) {
            assert.equal(fs.lstatSync(binding).isSymbolicLink(), false);
            assert.deepEqual(fs.readdirSync(binding), []);
          }
          function bytesFor(relative) {
            assert.ok(relative && !path.isAbsolute(relative) && !relative.split("/").includes(".."));
            const entry = tree.get(relative);
            assert.ok(entry, "untracked dependency " + relative);
            assert.equal(entry.type, "blob");
            assert.ok(["100644", "100755"].includes(entry.mode), "not a regular tracked file");
            const source = path.join(checkout, relative), st = fs.lstatSync(source);
            assert.ok(st.isFile() && !st.isSymbolicLink());
            const bytes = fs.readFileSync(source);
            const actual = crypto.createHash("sha1").update("blob " + bytes.length + "\0").update(bytes).digest("hex");
            assert.equal(actual, entry.blob, "source blob mismatch: " + relative);
            return { bytes, entry };
          }
          const manifest = JSON.parse(bytesFor(manifestPath).bytes.toString("utf8"));
          assert.equal(manifest.sources.length, 254);
          assert.equal(new Set(manifest.sources).size, manifest.sources.length);
          const proof = { source_head: head, source_manifest_blob: tree.get(manifestPath).blob,
            test_blob: tree.get(testPath).blob, blobs: {} };
          for (const [file, blob] of Object.entries(manifest.protected_source_blobs)) {
            assert.equal(bytesFor(file).entry.blob, blob, "protected existing behavior changed: " + file);
          }
          for (const relative of [...manifest.sources, manifestPath, testPath]) {
            assert.ok(!relative.startsWith(".agent/") && !relative.includes("node_modules/"));
            const { bytes, entry } = bytesFor(relative);
            const dest = path.join(root, relative);
            fs.mkdirSync(path.dirname(dest), { recursive: true });
            fs.writeFileSync(dest, bytes, { flag: "wx", mode: entry.mode === "100755" ? 0o755 : 0o644 });
            if (manifest.sources.includes(relative)) proof.blobs[relative] = entry;
          }
          fs.writeFileSync(path.join(root, "phase-zero-source-proof.json"), JSON.stringify(proof) + "\n", { flag: "wx" });
          console.log(JSON.stringify({ source_head: head, node: process.version, static_source_files: 254,
            source_manifest_blob: proof.source_manifest_blob, test_blob: proof.test_blob,
            protected_source_blobs: manifest.protected_source_blobs }));
          NODE
          cd "$scratch/source"
          env -i PATH="" HOME="$scratch/home" USERPROFILE="$scratch/home" \
            TMPDIR="$scratch/tmp" TMP="$scratch/tmp" TEMP="$scratch/tmp" \
            XDG_CONFIG_HOME="$scratch/home" LANG=C LC_ALL=C TZ=UTC \
            /usr/bin/timeout --signal=TERM --kill-after=5 180 "$node_bin" --test --test-concurrency=1 \
            --test-reporter=tap tests/dispatch/phase-zero-bin-boundary.test.js | tee "$scratch/tap.log"
          env -i PATH="" HOME="$scratch/home" "$node_bin" - "$scratch/tap.log" <<'NODE'
          const fs = require("node:fs"), assert = require("node:assert/strict");
          const tap = fs.readFileSync(process.argv[2], "utf8");
          for (const [key, count] of Object.entries({tests: 22, pass: 22, fail: 0, skipped: 0, cancelled: 0, todo: 0})) {
            const actual = [...tap.matchAll(new RegExp("^# " + key + " (\\d+)\\s*$", "gm"))].map((item) => Number(item[1]));
            assert.deepEqual(actual, [count], "unexpected TAP " + key);
          }
          NODE
