name: M-041 Runtime Safety

on:
  pull_request:
    paths:
      - "bin/cli.js"
      - "lib/cli/effect.js"
      - "lib/commands/management/write.js"
      - "lib/state-sync/**"
      - "templates/_shared/.agent/skills/management-api/scripts/index.js"
      - "tests/cli/effect.test.js"
      - "tests/cli/issue-15-waitpoints-help-state-sync.test.js"
      - "tests/commands/management/write.test.js"
      - "tests/state-sync/state-sync.test.js"
      - ".github/workflows/m041-runtime-safety.yml"
  workflow_dispatch:

jobs:
  focused:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Command effect contract
        run: node --test tests/cli/effect.test.js
      - name: Management writer contract
        run: node --test tests/commands/management/write.test.js
      - name: State sync exact paths
        run: |
          node --test tests/state-sync/state-sync.test.js
          node --test tests/state-sync/state-sync-auto.test.js
      - name: Issue 15 integration
        run: node --test tests/cli/issue-15-waitpoints-help-state-sync.test.js
      - name: Management CLI integration
        run: node --test tests/management/management-writer-cli.test.js
      - name: Module load smoke
        run: |
          node -e "require('./lib/cli/effect'); require('./lib/commands/management/write'); require('./lib/state-sync')"
          node --check templates/_shared/.agent/skills/management-api/scripts/index.js
      - name: Package manifest smoke
        run: npm pack --dry-run --json > /tmp/m041-pack.json
