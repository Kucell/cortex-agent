name: M-041 Platformization Validation

on:
  push:
    branches:
      - "feat/m041-*"
    paths:
      - "packages/**"
      - "lib/platform-health/**"
      - "lib/platform/**"
      - "lib/project-registry/**"
      - "lib/control-service/**"
      - "lib/commands/project-platform.js"
      - "lib/commands/daemon.js"
      - "lib/mcp/**"
      - "lib/dashboard/**"
      - "bin/cli.js"
      - "templates/_shared/.agent/dispatch/**"
      - "templates/_shared/.agent/skills/management-api/scripts/query-dispatch-state.js"
      - "templates/en/.agent/skills/management-api/scripts/query-dispatch-state.js"
      - "templates/zh/.agent/skills/management-api/scripts/query-dispatch-state.js"
      - "templates/_shared/.agent/skills/agent-dashboard/**"
      - "tests/platform-health/**"
      - "tests/platform/**"
      - "tests/project-registry/**"
      - "tests/control-service/**"
      - "tests/commands/project-platform.test.js"
      - "tests/commands/m041-daemon-cli.test.js"
      - "tests/mcp/**"
      - "tests/dashboard/**"
      - "tests/architecture/m041-*.test.js"
      - "scripts/m041/**"
      - "docs/architecture/platform-health-v1.md"
      - "docs/architecture/m041-public-package-eligibility.md"
      - "docs/architecture/control-service-daemon-v1.md"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/m041-validation.yml"
  pull_request:
    paths:
      - "packages/**"
      - "lib/platform-health/**"
      - "lib/platform/**"
      - "lib/project-registry/**"
      - "lib/control-service/**"
      - "lib/commands/project-platform.js"
      - "lib/commands/daemon.js"
      - "lib/mcp/**"
      - "lib/dashboard/**"
      - "bin/cli.js"
      - "templates/_shared/.agent/dispatch/**"
      - "templates/_shared/.agent/skills/management-api/scripts/query-dispatch-state.js"
      - "templates/en/.agent/skills/management-api/scripts/query-dispatch-state.js"
      - "templates/zh/.agent/skills/management-api/scripts/query-dispatch-state.js"
      - "templates/_shared/.agent/skills/agent-dashboard/**"
      - "tests/platform-health/**"
      - "tests/platform/**"
      - "tests/project-registry/**"
      - "tests/control-service/**"
      - "tests/commands/project-platform.test.js"
      - "tests/commands/m041-daemon-cli.test.js"
      - "tests/mcp/**"
      - "tests/dashboard/**"
      - "tests/architecture/m041-*.test.js"
      - "scripts/m041/**"
      - "docs/architecture/platform-health-v1.md"
      - "docs/architecture/m041-public-package-eligibility.md"
      - "docs/architecture/control-service-daemon-v1.md"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/m041-validation.yml"


permissions:
  contents: read

jobs:
  platformization:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.13.1 --activate
      - name: Install workspace
        run: pnpm install --frozen-lockfile
      - name: Run M-040 compatibility baseline
        run: pnpm test:m040
      - name: Run M-041 contract-freeze validation
        run: pnpm test:m041
