name: Full Test Suite

# 为什么这个 workflow 不带 paths 过滤：
#
# 仓库里其它 workflow 全部按 paths 过滤（各有专项），导致两个问题：
#   1. 改动落在任何现有 paths 之外时，PR 上一个 workflow 都不会跑；
#   2. GitHub required status checks 只能绑定到「pull_request 触发且无 paths 限制」的
#      workflow —— 有 paths 过滤的 workflow 在某些 PR 上根本不出现 check，
#      配成 required 会让 PR 永远卡住。
#
# 见 .agent/rules/vcs-pr-flow.md §4.2。本 workflow 是仓库唯一的无过滤全量门禁。
#
# required status check 的 context 名 = check run 的 name 字段 = job id，
# 即 `full-test`（**不是** PR 页面上显示的 `Full Test Suite / full-test`）。
# 配成展示串会导致 check 明明 success 但 PR 永远卡在 BLOCKED。

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      # `.agent` 在主仓是一个 gitlink（mode 160000），但仓库没有 .gitmodules，
      # 所以 `submodules: true` 拉不到它 —— checkout 只会留下一个空目录。
      # 而全量测试里有 61 个测试文件依赖 `.agent/` 工作实例（规则、workflow、
      # skill 脚本），缺了它这些测试会失败。
      #
      # cortex-agent-agent 是私有仓，CI 需要用仓库已有的只读治理 token
      # （与 governance-read-preflight 同一个 secret）来拉取。
      # 这里按 gitlink 里记录的 pin 显式拉取，不硬编码 commit。
      - name: Fetch .agent governance repo at gitlink pin
        env:
          CORTEX_GOVERNANCE_READ_TOKEN: ${{ secrets.CORTEX_GOVERNANCE_READ_TOKEN }}
        run: |
          set -euo pipefail
          PIN=$(git ls-tree HEAD .agent | awk '{print $3}')
          if [ -z "$PIN" ]; then
            echo "::error::no .agent gitlink found in the tree"
            exit 1
          fi
          if [ -z "${CORTEX_GOVERNANCE_READ_TOKEN:-}" ]; then
            echo "::error::CORTEX_GOVERNANCE_READ_TOKEN is not available — cannot read the private governance repo"
            exit 1
          fi
          AUTH=$(printf 'x-access-token:%s' "$CORTEX_GOVERNANCE_READ_TOKEN" | base64 | tr -d '\n')
          git init -q .agent
          git -C .agent remote add origin https://github.com/Kucell/cortex-agent-agent.git
          if git -C .agent -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" \
                fetch -q --depth 1 origin "$PIN"; then
            git -C .agent checkout -q FETCH_HEAD
            echo "::notice::.agent checked out at pinned $PIN"
          else
            echo "::warning::could not fetch pinned $PIN directly; fetching main and looking it up"
            git -C .agent -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" \
              fetch -q --depth 200 origin main
            git -C .agent checkout -q "$PIN" || git -C .agent checkout -q FETCH_HEAD
            echo "::notice::.agent checked out at $(git -C .agent rev-parse HEAD)"
          fi
          echo "::notice::.agent rules: $(ls .agent/rules | wc -l) files"

      - uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.13.1 --activate
          pnpm --version

      - name: Frozen workspace install
        run: pnpm install --frozen-lockfile

      - name: L3 distribution boundary check
        run: pnpm check:l3

      - name: Template parity check
        run: pnpm check:parity

      - name: Run full test suite
        # test:ci runs the runner in strict hermetic mode: the suite must not
        # write a single byte into .agent/. In CI nothing else can write there
        # (no live agent session, no Dashboard supervisor daemon), so any drift
        # is a genuine non-hermetic test. See .agent/rules/test-policy.md §3.4.
        run: pnpm test:ci

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-test-evidence-${{ github.run_id }}
          path: .agent/metrics/
          if-no-files-found: warn
          retention-days: 7
