name: Decision Resolution Isolation

on:
  pull_request:
    paths:
      - "templates/**/.agent/skills/management-api/scripts/**"
      - "templates/_shared/.agent/tasks/scripts/task-state.js"
      - "tests/communication/decision-resolution-isolation.test.js"
      - "tests/communication/serializer-schema.test.js"
      - "templates/_shared/.agent/decisions/decision.schema.json"
      - "templates/_shared/.agent/waitpoints/waitpoint.schema.json"
      - ".github/workflows/decision-resolution-isolation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    env:
      SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      CORTEX_STATE_SYNC: "off"
    steps:
      - name: Materialize verified exact-head isolation sources
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("node:fs");
            const path = require("node:path");
            const crypto = require("node:crypto");
            const assert = require("node:assert/strict");
            const head = process.env.SOURCE_HEAD;
            assert.match(head || "", /^[0-9a-f]{40}$/);
            const { owner, repo } = context.repo;
            const { data: commit } = await github.rest.git.getCommit({
              owner, repo, commit_sha: head,
            });
            assert.equal(commit.sha, head, "source commit mismatch");
            const root = process.env.GITHUB_WORKSPACE;
            assert.ok(root, "GITHUB_WORKSPACE is required");
            for (const relative of [
              "tests/communication/decision-resolution-isolation.test.js",
              "tests/communication/serializer-schema.test.js",
              "templates/_shared/.agent/decisions/decision.schema.json",
              "templates/_shared/.agent/waitpoints/waitpoint.schema.json",
              "templates/_shared/.agent/skills/management-api/scripts/index.js",
              "templates/en/.agent/skills/management-api/scripts/index.js",
              "templates/zh/.agent/skills/management-api/scripts/index.js",
              "templates/_shared/.agent/skills/management-api/scripts/normalize-token-usage.js",
              "templates/_shared/.agent/skills/management-api/scripts/query-activity.js",
              "templates/_shared/.agent/skills/management-api/scripts/query-dispatch-state.js",
              "templates/_shared/.agent/skills/management-api/scripts/projection-registry.json",
              "templates/_shared/.agent/tasks/scripts/task-state.js",
            ]) {
              const { data: file } = await github.rest.repos.getContent({
                owner, repo, path: relative, ref: head,
              });
              assert.ok(file && !Array.isArray(file), "expected one file");
              assert.equal(file.type, "file");
              assert.equal(file.path, relative);
              assert.equal(file.encoding, "base64");
              assert.equal(typeof file.content, "string");
              const bytes = Buffer.from(file.content, "base64");
              assert.equal(bytes.length, file.size, "source size mismatch");
              const blob = crypto.createHash("sha1")
                .update("blob " + bytes.length + "\0").update(bytes).digest("hex");
              assert.equal(blob, file.sha, "source blob mismatch");
              const destination = path.join(root, relative);
              fs.mkdirSync(path.dirname(destination), { recursive: true });
              fs.writeFileSync(destination, bytes, { flag: "wx" });
              core.info("Source " + head + ": " + relative + " (blob " + blob + ")");
            }
            core.info("Verified source head: " + head);
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Check isolation syntax
        run: |
          node --check templates/_shared/.agent/skills/management-api/scripts/index.js
          node --check templates/en/.agent/skills/management-api/scripts/index.js
          node --check templates/zh/.agent/skills/management-api/scripts/index.js
          node --check tests/communication/decision-resolution-isolation.test.js
          node --check tests/communication/serializer-schema.test.js
      - name: Run fifteen Decision isolation cases
        run: node --test tests/communication/decision-resolution-isolation.test.js
      - name: Check real serializers against closed schemas in fresh offline fixtures
        run: node --test tests/communication/serializer-schema.test.js
