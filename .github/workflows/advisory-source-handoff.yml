name: Advisory Source and Handoff Contracts

on:
  pull_request:
    paths:
      - "lib/governance/git-store.js"
      - "lib/governance/store.js"
      - "packages/project-sdk/src/governance.js"
      - "packages/runtime-port/src/topology.js"
      - "packages/protocol/src/index.js"
      - "packages/protocol/src/refs.js"
      - "packages/protocol/src/version.js"
      - "packages/protocol/src/result.js"
      - "packages/protocol/src/capabilities.js"
      - "packages/protocol/src/events.js"
      - "packages/protocol/src/timeline.js"
      - "packages/protocol/src/negotiation.js"
      - "packages/protocol/src/evolution.js"
      - "tests/protocol/evolution.test.js"
      - "lib/evolution/reasoning-handoff.js"
      - "tests/evolution/reasoning-handoff.test.js"
      - "lib/next-action/canonical-task-source.js"
      - "tests/next-action/canonical-task-source.test.js"
      - "lib/next-action/index.js"
      - "tests/next-action/advisor.test.js"
      - ".github/workflows/advisory-source-handoff.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preservation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    env:
      SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Materialize verified exact-head advisory fixture closure
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("node:fs");
            const path = require("node:path");
            const crypto = require("node:crypto");
            const assert = require("node:assert/strict");
            const head = process.env.SOURCE_HEAD;
            assert.match(head || "", /^[0-9a-f]{40}$/);
            const { owner, repo } = context.repo;
            const { data: commit } = await github.rest.git.getCommit({
              owner, repo, commit_sha: head,
            });
            assert.equal(commit.sha, head, "source commit mismatch");
            const root = process.env.GITHUB_WORKSPACE;
            assert.ok(root, "GITHUB_WORKSPACE is required");
            for (const relative of [
              "lib/governance/git-store.js",
              "lib/governance/store.js",
              "packages/project-sdk/src/governance.js",
              "packages/runtime-port/src/topology.js",
              "packages/protocol/src/index.js",
              "packages/protocol/src/refs.js",
              "packages/protocol/src/version.js",
              "packages/protocol/src/result.js",
              "packages/protocol/src/capabilities.js",
              "packages/protocol/src/events.js",
              "packages/protocol/src/timeline.js",
              "packages/protocol/src/negotiation.js",
              "packages/protocol/src/evolution.js",
              "tests/protocol/evolution.test.js",
              "lib/evolution/reasoning-handoff.js",
              "tests/evolution/reasoning-handoff.test.js",
              "lib/next-action/canonical-task-source.js",
              "tests/next-action/canonical-task-source.test.js",
              "lib/next-action/index.js",
              "tests/next-action/advisor.test.js",
            ]) {
              const { data: file } = await github.rest.repos.getContent({
                owner, repo, path: relative, ref: head,
              });
              assert.ok(file && !Array.isArray(file), "expected one file");
              assert.equal(file.type, "file");
              assert.equal(file.path, relative);
              assert.equal(file.encoding, "base64");
              assert.equal(typeof file.content, "string");
              const bytes = Buffer.from(file.content, "base64");
              assert.equal(bytes.length, file.size, "source size mismatch");
              const blob = crypto.createHash("sha1")
                .update("blob " + bytes.length + "\0").update(bytes).digest("hex");
              assert.equal(blob, file.sha, "source blob mismatch");
              const destination = path.join(root, relative);
              fs.mkdirSync(path.dirname(destination), { recursive: true });
              fs.writeFileSync(destination, bytes, { flag: "wx" });
              core.info("Source " + head + ": " + relative + " (blob " + blob + ")");
            }
            core.info("Verified source head: " + head);
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Check new source and fixture syntax
        run: |
          node --check lib/evolution/reasoning-handoff.js
          node --check lib/next-action/canonical-task-source.js
          node --check tests/evolution/reasoning-handoff.test.js
          node --check tests/next-action/canonical-task-source.test.js
          node --check packages/protocol/src/evolution.js
      - name: Run only scoped protocol, handoff, advisor and canonical-source fixtures
        run: node --test tests/protocol/evolution.test.js tests/evolution/reasoning-handoff.test.js tests/next-action/advisor.test.js tests/next-action/canonical-task-source.test.js
