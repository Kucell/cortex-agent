name: M-042 State Registry and Index

on:
  pull_request:
    paths:
      - "bin/cli.js"
      - "lib/cli/contract.js"
      - "lib/state-registry/**"
      - "lib/state-sync/**"
      - "lib/governance-index/**"
      - "templates/_shared/.agent/contracts/state-classes*"
      - "templates/_shared/.agent/.githooks/pre-commit"
      - "tests/state-registry/**"
      - "tests/state-sync/**"
      - "tests/governance-index/**"
      - "tests/management/management-writer-cli.test.js"
      - "tests/cli/issue-15-waitpoints-help-state-sync.test.js"
      - ".github/workflows/m042-state-registry-index.yml"
  workflow_dispatch:

jobs:
  focused:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: State Class Registry
        run: node --test tests/state-registry/*.test.js
      - name: Governance index
        run: node --test tests/governance-index/*.test.js
      - name: State Sync regression
        run: |
          node --test tests/state-sync/state-sync.test.js
          node --test tests/state-sync/state-sync-auto.test.js
          node --test tests/install/install-state-githooks.test.js
      - name: M-041 exact-sync regression
        run: node --test tests/cli/issue-15-waitpoints-help-state-sync.test.js
      - name: Management writer projection contract
        run: node --test tests/management/management-writer-cli.test.js
      - name: Syntax and module smoke
        run: |
          bash -n templates/_shared/.agent/.githooks/pre-commit
          node --check lib/governance-index/index.js
          node --check lib/governance-index/cli.js
          node -e "require('./lib/state-registry'); require('./lib/state-sync'); require('./lib/governance-index')"
      - name: Package contract smoke
        run: |
          npm pack --dry-run --json > /tmp/m042-pack.json
          node - <<'NODE'
          const fs = require("fs");
          const data = JSON.parse(fs.readFileSync("/tmp/m042-pack.json", "utf8"));
          const files = new Set((data[0].files || []).map((entry) => entry.path));
          for (const required of [
            "templates/_shared/.agent/contracts/state-classes.json",
            "templates/_shared/.agent/contracts/state-classes.schema.json",
            "lib/state-registry/index.js",
            "lib/governance-index/index.js",
            "lib/governance-index/cli.js",
          ]) {
            if (!files.has(required)) throw new Error("package missing " + required);
          }
          NODE
