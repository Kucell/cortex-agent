name: npm Release

on:
  # npm Trusted Publishing rejects OIDC tokens minted for issue_comment runs
  # (pull_request_target is rejected too), so publication is dispatched
  # explicitly and carries the canonical Decision/Waitpoint authorization.
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the prepared current version to npm and GitHub Releases"
        required: true
        default: false
        type: boolean
      release_type:
        description: "Release type to publish (the prepared current version)"
        required: true
        default: current
        type: choice
        options:
          - current
      dist_tag:
        description: "npm distribution tag to publish"
        required: true
        default: latest
        type: choice
        options:
          - latest
      release_pr:
        description: "Merged release-preparation PR number"
        required: true
        type: string
      expected_sha:
        description: "Exact intended main commit SHA"
        required: true
        type: string
      decision_id:
        description: "Canonical live release Decision ID"
        required: true
        type: string
      waitpoint_id:
        description: "Canonical released Waitpoint ID"
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  pull-requests: read
  issues: read

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  targeted-cli-validation:
    # Only the reviewed nine CLI regressions; no release credentials or OIDC.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          submodules: false
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
      - name: Verify shipped reconcile CLI entrypoint in isolated environment
        env:
          SOURCE_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          node_bin="$(command -v node)"
          /usr/bin/env -i PATH=/usr/bin:/bin /usr/bin/python3 -I \
            scripts/release/targeted-cli-validation.py \
            --expected-head "$SOURCE_HEAD" --node "$node_bin"

  release:
    needs: [targeted-cli-validation]
    # Owner dispatch is the explicit human release action, and it carries the
    # same canonical private Decision/Waitpoint gate as every other path.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          submodules: false

      - name: Verify exact-head Cortex release authorization
        if: ${{ inputs.publish }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CORTEX_GOVERNANCE_READ_TOKEN: ${{ secrets.CORTEX_GOVERNANCE_READ_TOKEN }}
        run: |
          set -euo pipefail
          node scripts/release/verify-owner-dispatch.cjs
          node scripts/release/verify-approved-release.cjs

      - uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
          registry-url: "https://registry.npmjs.org"

      - name: Install npm Trusted Publishing compatible CLI
        run: |
          npm install --global npm@11
          NPM_VERSION="$(npm --version)"
          NPM_VERSION="$NPM_VERSION" node - <<'NODE'
          const [major, minor, patch] = String(process.env.NPM_VERSION)
            .split(".")
            .map(Number);
          const ok = major > 11 || (major === 11 && (minor > 5 || (minor === 5 && patch >= 1)));
          if (!ok) {
            console.error(`npm >= 11.5.1 required, got ${process.env.NPM_VERSION}`);
            process.exit(1);
          }
          NODE
          echo "$NPM_VERSION"

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.13.1 --activate
          pnpm --version

      - name: Frozen workspace install
        run: pnpm install --frozen-lockfile

      - name: Run architecture guard
        run: pnpm guard:m040

      - name: Run focused product validation
        run: pnpm test:m040

      - name: Verify package can be packed
        run: npm pack --dry-run --json > npm-release-pack-dry-run.json

      - name: Prepare release version
        id: version
        env:
          RELEASE_TYPE: current
        run: |
          set -euo pipefail

          before="$(node -p "require('./package.json').version")"
          if [[ "$RELEASE_TYPE" == "current" ]]; then
            target="$before"
          else
            npm version "$RELEASE_TYPE" --no-git-tag-version
            target="$(node -p "require('./package.json').version")"
          fi

          echo "before=$before" >> "$GITHUB_OUTPUT"
          echo "target=$target" >> "$GITHUB_OUTPUT"
          echo "tag=v$target" >> "$GITHUB_OUTPUT"

      - name: Validate release state
        env:
          TARGET: ${{ steps.version.outputs.target }}
          RELEASE_TYPE: current
        run: |
          set -euo pipefail

          package_name="$(node -p "require('./package.json').name")"

          if npm view "$package_name@$TARGET" version --json > /tmp/npm-version.json 2>/dev/null; then
            published="$(node -e "const fs=require('fs'); const v=JSON.parse(fs.readFileSync('/tmp/npm-version.json','utf8')); process.stdout.write(Array.isArray(v)?String(v[0]||''):String(v||''));")"
            if [[ "$published" == "$TARGET" && "$RELEASE_TYPE" != "current" ]]; then
              echo "::error::$package_name@$TARGET is already published; choose current to resume an existing release."
              exit 1
            fi
          fi

          if git rev-parse -q --verify "refs/tags/v$TARGET" >/dev/null; then
            tag_commit="$(git rev-list -n 1 "v$TARGET")"
            head_commit="$(git rev-parse HEAD)"
            if [[ "$RELEASE_TYPE" != "current" || "$tag_commit" != "$head_commit" ]]; then
              echo "::error::Tag v$TARGET already exists at $tag_commit."
              exit 1
            fi
          fi

      - name: Dry-run summary
        if: ${{ !inputs.publish }}
        env:
          TARGET: ${{ steps.version.outputs.target }}
          RELEASE_TYPE: current
          DIST_TAG: latest
        run: |
          echo "Dry run only; no repository or registry writes will occur."
          echo "release_type=$RELEASE_TYPE"
          echo "target=$TARGET"
          echo "dist_tag=$DIST_TAG"

      - name: Revalidate Cortex authorization before Git tag write
        if: ${{ inputs.publish }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CORTEX_GOVERNANCE_READ_TOKEN: ${{ secrets.CORTEX_GOVERNANCE_READ_TOKEN }}
        run: |
          set -euo pipefail
          candidate="$(git rev-parse HEAD)"
          upstream="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [[ "$candidate" != "$upstream" ]]; then
            echo "::error::Release HEAD changed before tag; refusing release."
            exit 1
          fi
          node scripts/release/verify-owner-dispatch.cjs
          node scripts/release/verify-approved-release.cjs

      - name: Commit version and create tag
        if: ${{ inputs.publish }}
        env:
          TARGET: ${{ steps.version.outputs.target }}
          RELEASE_TYPE: current
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [[ "$RELEASE_TYPE" != "current" ]]; then
            git add package.json
            if [[ -f package-lock.json ]]; then
              git add package-lock.json
            fi
            git commit -m "chore(release): v$TARGET"
          fi

          if ! git rev-parse -q --verify "refs/tags/v$TARGET" >/dev/null; then
            git tag -a "v$TARGET" -m "v$TARGET"
          fi

          git push origin HEAD:main
          git push origin "v$TARGET"

      - name: Verify main/tag immutability before any registry write
        if: ${{ inputs.publish }}
        env:
          TARGET: ${{ steps.version.outputs.target }}
        run: |
          set -euo pipefail
          candidate="$(git rev-parse HEAD)"
          upstream="$(git ls-remote origin refs/heads/main | cut -f1)"
          tag_commit="$(git rev-list -n 1 "v$TARGET")"
          if [[ "$candidate" != "$upstream" || "$candidate" != "$tag_commit" ]]; then
            echo "::error::Release candidate drifted after validation; refusing npm publish."
            exit 1
          fi

      - name: Revalidate Cortex authorization at npm effect boundary
        if: ${{ inputs.publish }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CORTEX_GOVERNANCE_READ_TOKEN: ${{ secrets.CORTEX_GOVERNANCE_READ_TOKEN }}
        run: |
          set -euo pipefail
          node scripts/release/verify-owner-dispatch.cjs
          node scripts/release/verify-approved-release.cjs

      - name: Publish to npm with Trusted Publishing
        if: ${{ inputs.publish }}
        env:
          TARGET: ${{ steps.version.outputs.target }}
          DIST_TAG: latest
        run: |
          set -euo pipefail

          package_name="$(node -p "require('./package.json').name")"
          published=""

          if npm view "$package_name@$TARGET" version --json > /tmp/npm-version.json 2>/dev/null; then
            published="$(node -e "const fs=require('fs'); const v=JSON.parse(fs.readFileSync('/tmp/npm-version.json','utf8')); process.stdout.write(Array.isArray(v)?String(v[0]||''):String(v||''));")"
          fi

          if [[ "$published" == "$TARGET" ]]; then
            echo "$package_name@$TARGET is already published; treating npm publish as completed."
          else
            npm publish --access public --tag "$DIST_TAG"
          fi

      - name: Create GitHub Release
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ steps.version.outputs.target }}
        run: |
          set -euo pipefail
          if gh release view "v$TARGET" >/dev/null 2>&1; then
            echo "GitHub Release v$TARGET already exists."
          else
            gh release create "v$TARGET" --verify-tag --generate-notes --title "v$TARGET"
          fi

      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-release-evidence
          path: |
            npm-release-pack-dry-run.json
            npm-owner-dispatch-audit.json
          if-no-files-found: warn
          retention-days: 30
