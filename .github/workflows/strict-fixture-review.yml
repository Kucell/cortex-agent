name: Strict Fixture Offline Review

on:
  pull_request:
    paths:
      - "tests/dispatch/strict-approval.test.js"
      - "tests/runtime-port/strict-fixture-process.test.js"
      - "tests/runtime-port/strict-fixture.test.js"
      - "tests/runtime-state/strict-fixture-sink.test.js"
      - "lib/dispatch/strict-approval.js"
      - "lib/runtime-port/strict-fixture-process.js"
      - "lib/runtime-port/strict-fixture.js"
      - "lib/runtime-state/strict-fixture-sink.js"
      - "lib/runtime-state/operation-lifecycle.js"
      - "lib/governance/root.js"
      - "lib/governance/store.js"
      - "lib/runtime-layout/index.js"
      - "lib/runtime-layout/resolver.js"
      - "lib/runtime-layout/identity.js"
      - "lib/runtime-layout/logical-uri.js"
      - "lib/runtime-layout/local-binding.js"
      - "lib/runtime-layout/schemas.js"
      - "lib/security/scan.js"
      - "lib/coordination/lease-store.js"
      - "lib/coordination/lease.js"
      - "lib/coordination/errors.js"
      - "packages/project-sdk/src/governance.js"
      - "packages/runtime-port/src/index.js"
      - "packages/runtime-port/src/topology.js"
      - "packages/protocol/src/index.js"
      - "packages/protocol/src/refs.js"
      - "packages/protocol/src/version.js"
      - "packages/protocol/src/result.js"
      - "packages/protocol/src/capabilities.js"
      - "packages/protocol/src/events.js"
      - "packages/protocol/src/timeline.js"
      - "packages/protocol/src/negotiation.js"
      - "packages/protocol/src/evolution.js"
      - "templates/_shared/.agent/decisions/decision.schema.json"
      - "templates/_shared/.agent/waitpoints/waitpoint.schema.json"
      - "tests/fixtures/l3/strict-process-worker.cjs"
      - ".github/workflows/strict-fixture-review.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    env:
      SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      NODE_OPTIONS: ""
      NODE_PATH: ""
    steps:
      - name: Materialize verified exact-head offline fixture closure
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("node:fs");
            const path = require("node:path");
            const crypto = require("node:crypto");
            const assert = require("node:assert/strict");
            const head = process.env.SOURCE_HEAD;
            assert.match(head || "", /^[0-9a-f]{40}$/);
            const { owner, repo } = context.repo;
            const { data: commit } = await github.rest.git.getCommit({ owner, repo, commit_sha: head });
            assert.equal(commit.sha, head);
            const { data: tree } = await github.rest.git.getTree({
              owner, repo, tree_sha: commit.tree.sha, recursive: "true",
            });
            assert.equal(tree.truncated, false);
            assert.equal(tree.sha, commit.tree.sha);
            const root = process.env.GITHUB_WORKSPACE;
            assert.ok(root);
            assert.equal(fs.existsSync(path.join(root, "node_modules")), false);
            for (const relative of [
              "tests/dispatch/strict-approval.test.js",
              "tests/runtime-port/strict-fixture-process.test.js",
              "tests/runtime-port/strict-fixture.test.js",
              "tests/runtime-state/strict-fixture-sink.test.js",
              "lib/dispatch/strict-approval.js",
              "lib/runtime-port/strict-fixture-process.js",
              "lib/runtime-port/strict-fixture.js",
              "lib/runtime-state/strict-fixture-sink.js",
              "lib/runtime-state/operation-lifecycle.js",
              "lib/governance/root.js",
              "lib/governance/store.js",
              "lib/runtime-layout/index.js",
              "lib/runtime-layout/resolver.js",
              "lib/runtime-layout/identity.js",
              "lib/runtime-layout/logical-uri.js",
              "lib/runtime-layout/local-binding.js",
              "lib/runtime-layout/schemas.js",
              "lib/security/scan.js",
              "lib/coordination/lease-store.js",
              "lib/coordination/lease.js",
              "lib/coordination/errors.js",
              "packages/project-sdk/src/governance.js",
              "packages/runtime-port/src/index.js",
              "packages/runtime-port/src/topology.js",
              "packages/protocol/src/index.js",
              "packages/protocol/src/refs.js",
              "packages/protocol/src/version.js",
              "packages/protocol/src/result.js",
              "packages/protocol/src/capabilities.js",
              "packages/protocol/src/events.js",
              "packages/protocol/src/timeline.js",
              "packages/protocol/src/negotiation.js",
              "packages/protocol/src/evolution.js",
              "templates/_shared/.agent/decisions/decision.schema.json",
              "templates/_shared/.agent/waitpoints/waitpoint.schema.json",
              "tests/fixtures/l3/strict-process-worker.cjs"
            ]) {
              const entry = tree.tree.find((item) => item.path === relative);
              assert.ok(entry, "missing source: " + relative);
              assert.equal(entry.type, "blob");
              assert.equal(entry.mode, "100644");
              const { data: file } = await github.rest.repos.getContent({
                owner, repo, path: relative, ref: head,
              });
              assert.ok(file && !Array.isArray(file));
              assert.equal(file.type, "file");
              assert.equal(file.path, relative);
              assert.equal(file.encoding, "base64");
              assert.equal(file.sha, entry.sha);
              const bytes = Buffer.from(file.content, "base64");
              assert.equal(bytes.length, file.size);
              const blob = crypto.createHash("sha1")
                .update("blob " + bytes.length + "\0").update(bytes).digest("hex");
              assert.equal(blob, entry.sha);
              const destination = path.join(root, relative);
              assert.ok(destination.startsWith(root + path.sep));
              fs.mkdirSync(path.dirname(destination), { recursive: true });
              fs.writeFileSync(destination, bytes, { flag: "wx" });
              core.info("Source " + head + ": " + relative + " (blob " + blob + ")");
            }
            core.info("Verified source head: " + head + " / tree " + tree.sha);
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Run only reviewed mock and temporary-store negative cases
        shell: bash
        run: |
          set -euo pipefail
          scratch=$(mktemp -d "$RUNNER_TEMP/cortex-d-unit.XXXXXX")
          trap 'rm -rf -- "$scratch"' EXIT
          export HOME="$scratch/home" USERPROFILE="$scratch/home" TMPDIR="$scratch/tmp"
          export TMP="$TMPDIR" TEMP="$TMPDIR" XDG_CONFIG_HOME="$HOME"
          mkdir -p "$HOME" "$TMPDIR"
          node --version
          test ! -e node_modules
          node -e "try { require.resolve('@cortex-agent/protocol'); process.exitCode = 1; } catch (e) { if (e.code !== 'MODULE_NOT_FOUND') throw e; }"
          node --test --test-concurrency=1 \
            tests/dispatch/strict-approval.test.js \
            tests/runtime-port/strict-fixture-process.test.js \
            tests/runtime-port/strict-fixture.test.js \
            tests/runtime-state/strict-fixture-sink.test.js
