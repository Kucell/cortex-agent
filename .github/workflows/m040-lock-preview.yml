name: M-040 Lock Regenerator

on:
  push:
    branches:
      - "feat/m040-runtime-control-architecture"
    paths:
      - ".github/workflows/m040-lock-preview.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/m040-runtime-control-architecture
      - uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.13.1 --activate
      - name: Regenerate lockfile
        run: pnpm install --no-frozen-lockfile --lockfile-only
      - name: Commit generated lockfile
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "pnpm-lock.yaml already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore(m040): regenerate pnpm lockfile"
          git push origin HEAD:feat/m040-runtime-control-architecture
