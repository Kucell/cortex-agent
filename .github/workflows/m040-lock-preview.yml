name: M-040 Lock Preview

on:
  push:
    branches:
      - "feat/m040-runtime-control-architecture"
    paths:
      - ".github/workflows/m040-lock-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.13.1 --activate
      - name: Generate lockfile
        run: pnpm install --no-frozen-lockfile --lockfile-only
      - name: Print runtime-paseo importer
        run: |
          node - <<'NODE'
          const fs = require("node:fs");
          const text = fs.readFileSync("pnpm-lock.yaml", "utf8");
          const start = text.indexOf("  packages/runtime-paseo:");
          if (start < 0) throw new Error("runtime-paseo importer missing");
          const rest = text.slice(start);
          const match = rest.slice(2).search(/\n  packages\//);
          process.stdout.write(match < 0 ? rest : rest.slice(0, match + 2));
          NODE
      - name: Show Paseo lock presence
        run: |
          if grep -q "@getpaseo/client" pnpm-lock.yaml; then
            echo "PASEO_LOCK_ENTRY_PRESENT=true"
            grep -n "@getpaseo/client" pnpm-lock.yaml | head -20
          else
            echo "PASEO_LOCK_ENTRY_PRESENT=false"
          fi
