name: npm Release Automatic Preflight

on:
  push:
    branches: [main]
    paths:
      - package.json
      - package-lock.json
      - .claude-plugin/plugin.json
      - .claude-plugin/marketplace.json
      - CHANGELOG.md
  pull_request:
    paths:
      - .github/workflows/npm-release.yml
      - .github/workflows/npm-release-preflight.yml
      - scripts/release/**
      - tests/release/**
      - docs/releasing.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  targeted-cli-validation:
    # Only the reviewed nine CLI regressions; no release credentials or OIDC.
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          submodules: false
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
      - name: Verify shipped reconcile CLI entrypoint in isolated environment
        env:
          SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          node_bin="$(command -v node)"
          /usr/bin/env -i PATH=/usr/bin:/bin /usr/bin/python3 -I \
            scripts/release/targeted-cli-validation.py \
            --expected-head "$SOURCE_HEAD" --node "$node_bin"

  verify:
    needs: [targeted-cli-validation]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: false
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.13.1 --activate
      - name: Frozen install
        run: pnpm install --frozen-lockfile
      - name: Validate automatic release gate and existing workflow
        run: node --test tests/release/npm-release-workflow.test.js tests/release/verify-approved-release.test.js
      - name: Run architecture and focused product checks
        run: |
          pnpm guard:m040
          pnpm test:m040
      - name: Dry-run package build (never publish on preflight)
        run: npm pack --dry-run --json > npm-auto-preflight-pack.json
      - name: Upload preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-auto-release-preflight
          path: npm-auto-preflight-pack.json
          if-no-files-found: warn
          retention-days: 14
