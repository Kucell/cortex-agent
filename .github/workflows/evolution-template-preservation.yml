name: Evolution Template Preservation

on:
  pull_request:
    paths:
      - "lib/commands/session.js"
      - "templates/_shared/.agent/skills/evolution-pipeline/scripts/evolve.js"
      - "templates/_shared/.agent/skills/runtime-continuity/scripts/index.js"
      - "tests/evolution/evolve-no-write.test.js"
      - "tests/evolution/archive-proposal.test.js"
      - ".github/workflows/evolution-template-preservation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preservation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
        language: ["_shared"]
    env:
      SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      NODE_OPTIONS: ""
      NODE_PATH: ""
    steps:
      - name: Materialize verified exact-head evolution templates
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("node:fs");
            const path = require("node:path");
            const crypto = require("node:crypto");
            const assert = require("node:assert/strict");
            const head = process.env.SOURCE_HEAD;
            assert.match(head || "", /^[0-9a-f]{40}$/);
            const { owner, repo } = context.repo;
            const { data: commit } = await github.rest.git.getCommit({
              owner, repo, commit_sha: head,
            });
            assert.equal(commit.sha, head, "source commit mismatch");
            const { data: tree } = await github.rest.git.getTree({
              owner, repo, tree_sha: commit.tree.sha, recursive: "true",
            });
            assert.equal(tree.truncated, false);
            assert.equal(tree.sha, commit.tree.sha);
            const root = process.env.GITHUB_WORKSPACE;
            assert.ok(root, "GITHUB_WORKSPACE is required");
            assert.equal(fs.existsSync(path.join(root, "node_modules")), false);
            for (const relative of [
              "lib/commands/session.js",
              "templates/_shared/.agent/skills/evolution-pipeline/scripts/evolve.js",
              "templates/_shared/.agent/skills/runtime-continuity/scripts/index.js",
              "tests/evolution/evolve-no-write.test.js",
              "tests/evolution/archive-proposal.test.js",
            ]) {
              const entry = tree.tree.find((item) => item.path === relative);
              assert.ok(entry, "missing source: " + relative);
              assert.equal(entry.type, "blob");
              const executableTemplates = [
                "templates/_shared/.agent/skills/evolution-pipeline/scripts/evolve.js",
              ];
              assert.equal(entry.mode, executableTemplates.includes(relative) ? "100755" : "100644");
              const { data: file } = await github.rest.repos.getContent({
                owner, repo, path: relative, ref: head,
              });
              assert.ok(file && !Array.isArray(file), "expected one file");
              assert.equal(file.type, "file");
              assert.equal(file.path, relative);
              assert.equal(file.sha, entry.sha);
              assert.equal(file.encoding, "base64");
              assert.equal(typeof file.content, "string");
              const bytes = Buffer.from(file.content, "base64");
              assert.equal(bytes.length, file.size, "source size mismatch");
              const blob = crypto.createHash("sha1")
                .update("blob " + bytes.length + "\0").update(bytes).digest("hex");
              assert.equal(blob, file.sha, "source blob mismatch");
              const destination = path.join(root, relative);
              assert.ok(destination.startsWith(root + path.sep));
              fs.mkdirSync(path.dirname(destination), { recursive: true });
              fs.writeFileSync(destination, bytes, { flag: "wx" });
              core.info("Source " + head + ": " + relative + " (blob " + blob + ")");
            }
            core.info("Verified source head: " + head + " / tree " + tree.sha);
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Check exact-head fixture and script syntax
        run: |
          node --check lib/commands/session.js
          node --check templates/_shared/.agent/skills/evolution-pipeline/scripts/evolve.js
          node --check templates/_shared/.agent/skills/runtime-continuity/scripts/index.js
          node --check tests/evolution/evolve-no-write.test.js
          node --check tests/evolution/archive-proposal.test.js
      - name: Run scoped no-write and archive-proposal fixtures
        env:
          EVOLUTION_TEST_SCRIPT: ${{ github.workspace }}/templates/${{ matrix.language }}/.agent/skills/evolution-pipeline/scripts/evolve.js
          CONTINUITY_TEST_SCRIPT: ${{ github.workspace }}/templates/${{ matrix.language }}/.agent/skills/runtime-continuity/scripts/index.js
        shell: bash
        run: |
          set -euo pipefail
          scratch=$(mktemp -d "$RUNNER_TEMP/cortex-b-unit.XXXXXX")
          trap 'rm -rf -- "$scratch"' EXIT
          export HOME="$scratch/home" USERPROFILE="$scratch/home" TMPDIR="$scratch/tmp"
          export TMP="$TMPDIR" TEMP="$TMPDIR" XDG_CONFIG_HOME="$HOME"
          mkdir -p "$HOME" "$TMPDIR"
          node --version
          node --test --test-concurrency=1 tests/evolution/evolve-no-write.test.js tests/evolution/archive-proposal.test.js
