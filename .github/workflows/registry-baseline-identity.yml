name: Published Registry Baseline Identity

on:
  pull_request:
    paths:
      - "scripts/release/registry-baseline-identity.py"
      - ".github/workflows/registry-baseline-identity.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  registry-baseline-identity:
    if: >-
      github.repository == 'Kucell/cortex-agent' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'pull_request' &&
        github.event.pull_request.number == 70 &&
        github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Run only when this commit changes the registry identity check
        id: change
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        with:
          script: |
            core.setOutput("changed", "false");
            try {
              const assert = require("node:assert/strict");
              const {owner, repo} = context.repo;
              assert.equal(owner, "Kucell");
              assert.equal(repo, "cortex-agent");
              const head = context.payload.pull_request?.head.sha || context.sha;
              assert.match(head, /^[a-f0-9]{40}$/);
              const {data: commit} = await github.rest.git.getCommit({owner, repo, commit_sha: head});
              assert.equal(commit.sha, head);
              if (commit.parents.length !== 1) {
                core.info("IDENTITY_NOT_RUN: head must have exactly one parent"); return;
              }
              const {data: parent} = await github.rest.git.getCommit({owner, repo, commit_sha: commit.parents[0].sha});
              assert.equal(parent.sha, commit.parents[0].sha);
              const snapshots = [];
              for (const item of [commit, parent]) {
                const {data: tree} = await github.rest.git.getTree({owner, repo, tree_sha: item.tree.sha, recursive: "true"});
                assert.equal(tree.truncated, false);
                assert.equal(tree.sha, item.tree.sha);
                snapshots.push(tree.tree);
              }
              const paths = ["scripts/release/registry-baseline-identity.py", ".github/workflows/registry-baseline-identity.yml"];
              const signature = (tree, relative) => {
                const entry = tree.find((item) => item.path === relative);
                return entry ? [entry.mode, entry.type, entry.sha].join(":") : null;
              };
              const changed = paths.some((relative) => signature(snapshots[0], relative) !== signature(snapshots[1], relative));
              core.info(JSON.stringify({identity_head: head, parent: parent.sha, identity_paths_changed: changed}));
              if (!changed) {
                core.info("IDENTITY_NOT_RUN: no registry identity check change in this commit"); return;
              }
              assert.equal(signature(snapshots[0], paths[0]), "100644:blob:43edb3528bf62a3d27aa0bc094ec88a1230a3152");
              const workflow = snapshots[0].find((item) => item.path === paths[1]);
              assert.ok(workflow && workflow.mode === "100644" && workflow.type === "blob");
              core.setOutput("changed", "true");
            } catch (error) {
              core.warning("IDENTITY_NOT_RUN: unable to establish reviewed single-commit input");
              core.setFailed("Registry identity change guard could not verify its inputs");
            }
      - if: steps.change.outputs.changed == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SOURCE_HEAD }}
          fetch-depth: 1
          submodules: false
          persist-credentials: false
      - name: Read fixed official registry identity without executing package
        if: steps.change.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL_HEAD="$(/usr/bin/env -i PATH=/usr/bin:/bin GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null /usr/bin/git --no-lazy-fetch --no-replace-objects -c core.fsmonitor=false rev-parse HEAD)"
          test "$ACTUAL_HEAD" = "$SOURCE_HEAD"
          test -f scripts/release/registry-baseline-identity.py
          test ! -L scripts/release/registry-baseline-identity.py
          ACTUAL_GETTER_BLOB="$(/usr/bin/env -i PATH=/usr/bin:/bin GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null /usr/bin/git --no-lazy-fetch --no-replace-objects -c core.fsmonitor=false hash-object --no-filters scripts/release/registry-baseline-identity.py)"
          test "$ACTUAL_GETTER_BLOB" = "43edb3528bf62a3d27aa0bc094ec88a1230a3152"
          printf 'REGISTRY_IDENTITY_SOURCE_HEAD=%s\n' "$SOURCE_HEAD"
          printf 'REGISTRY_IDENTITY_GETTER_BLOB=%s\n' "$ACTUAL_GETTER_BLOB"
          /usr/bin/env -i PATH=/usr/bin:/bin LANG=C.UTF-8 LC_ALL=C.UTF-8 \
            /usr/bin/python3 -I -B --version
          /usr/bin/env -i PATH=/usr/bin:/bin LANG=C.UTF-8 LC_ALL=C.UTF-8 \
            /usr/bin/python3 -I -B scripts/release/registry-baseline-identity.py
