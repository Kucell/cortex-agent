<!doctype html>
<!--
  kobe-lite starter — kinetic-type hero (P-005 MS-005)
  ★ 唯一编辑对象:本文件。改 data-duration / 调色板 / clip 文案 / GSAP tween。
  Layout Before Animation:先写静态 CSS(hero frame),再描述 journey。
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>kobe-lite · kinetic type</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: #0b0b0f; }
  /* .scene-content 硬规则:全尺寸 + flex 容器,禁止 absolute 定位内容 */
  .scene-content {
    width: 100%;
    height: 100%;
    padding: 72px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 24px;
    box-sizing: border-box;
    overflow: hidden;
  }
  .kicker {
    font-family: Inter, system-ui, sans-serif;
    font-size: 20px;
    font-weight: 600;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: #ffb76b;
  }
  .headline {
    font-family: Inter, system-ui, sans-serif;
    font-size: 96px;
    font-weight: 800;
    line-height: 1.02;
    letter-spacing: -0.03em;
    color: #f5f5f7;
  }
  .headline em { font-style: normal; color: #ffb76b; }
  .sub {
    font-family: Inter, system-ui, sans-serif;
    font-size: 28px;
    font-weight: 400;
    color: #9a9aa4;
    max-width: 720px;
  }
  .rule {
    width: 120px;
    height: 4px;
    background: #ffb76b;
    border-radius: 2px;
  }
</style>
</head>
<body>
  <!-- root composition wrapper: data-composition-id 必须与 window.__timelines 注册键一致;
       data-width/data-height 为数值像素,hyperframes lint 硬校验 -->
  <div class="scene-content clip" data-composition-id="main" data-width="1920" data-height="1080" data-start="0" data-duration="6">
    <div class="rule"></div>
    <div class="kicker">Motion · 5th plane</div>
    <h1 class="headline">Brand color<br>drives the <em>moment</em></h1>
    <p class="sub">HTML + CSS + GSAP → deterministic MP4, straight into your edit.</p>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script>
    window.__timelines = window.__timelines || {};
    window.__timelines["main"] = gsap.timeline({ paused: true });
    // 入场:gsap.from() — offscreen/invisible → CSS 位置(CSS 是 ground truth)
    window.__timelines["main"]
      .from(".rule", { scaleX: 0, transformOrigin: "left center", duration: 0.6, ease: "power2.out" }, 0.0)
      .from(".kicker", { y: 24, opacity: 0, duration: 0.6, ease: "power2.out" }, 0.15)
      .from(".headline", { y: 56, opacity: 0, duration: 0.8, ease: "power2.out" }, 0.3)
      .from(".sub", { y: 24, opacity: 0, duration: 0.6, ease: "power2.out" }, 0.6);
  </script>
</body>
</html>
