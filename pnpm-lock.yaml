lockfileVersion: '9.0'

settings:
  autoInstallPeers: true
  excludeLinksFromLockfile: false

importers:

  .: {}

  packages/protocol: {}

  packages/sdk:
    dependencies:
      '@cortex-agent/protocol':
        specifier: workspace:*
        version: link:../protocol

  packages/runtime-port:
    dependencies:
      '@cortex-agent/protocol':
        specifier: workspace:*
        version: link:../protocol

  packages/extension-sdk:
    dependencies:
      '@cortex-agent/protocol':
        specifier: workspace:*
        version: link:../protocol

  packages/project-sdk:
    dependencies:
      '@cortex-agent/protocol':
        specifier: workspace:*
        version: link:../protocol

  packages/runtime-paseo:
    dependencies:
      '@cortex-agent/protocol':
        specifier: workspace:*
        version: link:../protocol
      '@cortex-agent/runtime-port':
        specifier: workspace:*
        version: link:../runtime-port
    peerDependencies:
      '@getpaseo/client':
        specifier: ^0.10.0
